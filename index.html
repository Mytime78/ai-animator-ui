<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Animator Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
  <div class="max-w-2xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-medium mb-3">
        Cloud-Native Studio
      </div>
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">AI Animator Studio</h1>
      <p class="text-slate-400 text-sm mt-1">สร้างวิดีโอแอนิเมชันขยับปากจากภาพนิ่งและเสียงสังเคราะห์</p>
    </header>

    <div class="space-y-6">
      <!-- 1. Connection Setting -->
      <section class="p-5 rounded-2xl bg-slate-900 border border-slate-800 shadow-sm">
        <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">
          1. เชื่อมต่อ Backend (Ngrok URL)
        </label>
        <div class="flex gap-2">
          <input type="url" id="backendUrl" placeholder="https://xxxx-xx-xx.ngrok-free.app" 
                 class="flex-1 bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
          <button id="btnCheckStatus" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-medium rounded-xl border border-slate-700 transition">
            ทดสอบ
          </button>
        </div>
        <p id="statusIndicator" class="text-xs text-slate-500 mt-2">ยังไม่ได้เชื่อมต่อกับ Kaggle/Colab</p>
      </section>

      <!-- 2. Inputs -->
      <section class="p-5 rounded-2xl bg-slate-900 border border-slate-800 shadow-sm space-y-5">
        <h2 class="text-xs font-medium uppercase tracking-wider text-slate-400">
          2. เตรียมข้อมูลและวัตถุดิบ
        </h2>

        <!-- Character Image -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">ภาพตัวละคร (Face Image)</label>
          <input type="file" id="imageInput" accept="image/*" 
                 class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-medium file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 file:cursor-pointer cursor-pointer border border-slate-800 rounded-xl p-1 bg-slate-950">
        </div>

        <!-- Reference Audio -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">ไฟล์เสียงต้นแบบสำหรับโคลน (5–15 วินาที)</label>
          <input type="file" id="audioInput" accept="audio/*" 
                 class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-medium file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 file:cursor-pointer cursor-pointer border border-slate-800 rounded-xl p-1 bg-slate-950">
        </div>

        <!-- Script Text -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">ข้อความสคริปต์ภาษาไทย</label>
          <textarea id="scriptText" rows="4" placeholder="พิมพ์ข้อความที่ต้องการให้ตัวละครพูดที่นี่..." 
                    class="w-full bg-slate-950 border border-slate-700/80 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
        </div>
      </section>

      <!-- 3. Actions -->
      <button id="btnGenerate" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white text-sm font-medium rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2">
        <span>เริ่มสร้างคลิปวิดีโอ (Generate)</span>
      </button>

      <!-- Progress / Status Display -->
      <div id="progressBox" class="hidden p-4 rounded-xl bg-indigo-950/40 border border-indigo-800/40 text-center">
        <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-400 border-t-transparent mb-2"></div>
        <p id="progressMessage" class="text-xs text-indigo-200">กำลังส่งข้อมูลไปยังระบบ...</p>
      </div>

      <!-- 4. Result Preview -->
      <section id="resultSection" class="hidden p-5 rounded-2xl bg-slate-900 border border-slate-800 shadow-sm space-y-4">
        <h2 class="text-xs font-medium uppercase tracking-wider text-emerald-400">
          วิดีโอผลลัพธ์พร้อมใช้งาน
        </h2>
        <div class="rounded-xl overflow-hidden bg-black aspect-[9/16] max-w-[280px] mx-auto border border-slate-800">
          <video id="resultVideo" controls class="w-full h-full object-cover"></video>
        </div>
        <a id="btnDownload" download="animation_output.mp4" 
           class="block w-full py-3 text-center bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-xl transition">
          ดาวน์โหลดวิดีโอลง iPad (.mp4)
        </a>
      </section>
    </div>
  </div>

  <script>
    const backendUrlInput = document.getElementById('backendUrl');
    const btnCheckStatus = document.getElementById('btnCheckStatus');
    const statusIndicator = document.getElementById('statusIndicator');
    const btnGenerate = document.getElementById('btnGenerate');
    const progressBox = document.getElementById('progressBox');
    const progressMessage = document.getElementById('progressMessage');
    const resultSection = document.getElementById('resultSection');
    const resultVideo = document.getElementById('resultVideo');
    const btnDownload = document.getElementById('btnDownload');

    // โหลด URL เดิมที่เคยบันทึกไว้ในเบราว์เซอร์
    const savedUrl = localStorage.getItem('animator_backend_url');
    if (savedUrl) backendUrlInput.value = savedUrl;

    btnCheckStatus.addEventListener('click', async () => {
      const url = backendUrlInput.value.trim().replace(/\/$/, "");
      if (!url) return alert('กรุณาระบุ Ngrok URL');
      localStorage.setItem('animator_backend_url', url);

      statusIndicator.textContent = 'กำลังตรวจสอบสถานะ...';
      statusIndicator.className = 'text-xs text-amber-400 mt-2';

      try {
        const res = await fetch(`${url}/health`, {
          headers: { "ngrok-skip-browser-warning": "69420" }
        });
        if (res.ok) {
          statusIndicator.textContent = 'เชื่อมต่อ Backend สำเร็จ พร้อมใช้งาน';
          statusIndicator.className = 'text-xs text-emerald-400 mt-2';
        } else {
          throw new Error();
        }
      } catch (err) {
        statusIndicator.textContent = 'ไม่สามารถเชื่อมต่อได้ ตรวจสอบ URL หรือสถานะการรันบน Kaggle/Colab';
        statusIndicator.className = 'text-xs text-rose-400 mt-2';
      }
    });

    btnGenerate.addEventListener('click', async () => {
      const url = backendUrlInput.value.trim().replace(/\/$/, "");
      const imgFile = document.getElementById('imageInput').files[0];
      const audioFile = document.getElementById('audioInput').files[0];
      const script = document.getElementById('scriptText').value.trim();

      if (!url) return alert('กรุณาระบุและทดสอบ Ngrok URL ก่อน');
      if (!imgFile) return alert('กรุณาเลือกภาพตัวละคร');
      if (!audioFile) return alert('กรุณาเลือกไฟล์เสียงต้นแบบ');
      if (!script) return alert('กรุณาระบุสคริปต์ข้อความ');

      const formData = new FormData();
      formData.append('image', imgFile);
      formData.append('audio', audioFile);
      formData.append('text', script);

      progressBox.classList.remove('hidden');
      resultSection.classList.add('hidden');
      btnGenerate.disabled = true;
      btnGenerate.classList.add('opacity-50', 'cursor-not-allowed');
      progressMessage.textContent = 'กำลังประมวลผล (เจนเสียงและขยับท่าทาง)...';

      try {
        const res = await fetch(`${url}/generate`, {
          method: 'POST',
          body: formData,
          headers: { "ngrok-skip-browser-warning": "69420" }
        });

        if (!res.ok) throw new Error('การประมวลผลล้มเหลว');

        const blob = await res.blob();
        const videoBlobUrl = URL.createObjectURL(blob);
        resultVideo.src = videoBlobUrl;
        btnDownload.href = videoBlobUrl;

        resultSection.classList.remove('hidden');
        progressBox.classList.add('hidden');
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการประมวลผล กรุณาตรวจสอบสถานะคอนโซลของ Backend');
        progressBox.classList.add('hidden');
      } finally {
        btnGenerate.disabled = false;
        btnGenerate.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    });
  </script>
</body>
</html>
